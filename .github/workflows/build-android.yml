name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android

      - name: Build debug APK
        run: |
          set -o pipefail
          npx cordova build android --verbose 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(grep -iE 'error|failed|not found|what went wrong' -A3 build.log | head -40 | tr '\n' '|')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: StudyDeck-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
