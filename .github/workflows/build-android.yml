name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # cordova-android 13 generates its Gradle wrapper with the system Gradle, which must be 8.x.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          # A cache saved by the old cordova-android 12 build (AGP 7) corrupts resource merging on AGP 8.
          cache-disabled: true

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "build-tools;33.0.2" "platforms;android-34"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform and plugins
        run: |
          set -o pipefail
          {
            npx cordova platform add android &&
            npx cordova plugin add cordova-plugin-camera@7.0.0 cordova-plugin-geolocation@5.0.0 ./native/cordova-plugin-studydeck-native
          } 2>&1 | tee setup.log || {
            echo "::error title=Setup failed::$(tail -40 setup.log | tr '\n' '|')"
            exit 1
          }

      - name: Build debug APK
        run: |
          set -o pipefail
          npx cordova build android --verbose 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(grep -iE 'error|failed|not found|what went wrong' -A3 build.log | head -40 | tr '\n' '|')"
            exit 1
          }

      - name: Report manifest permissions
        if: always()
        run: |
          M=platforms/android/app/src/main/AndroidManifest.xml
          if [ -f "$M" ]; then
            echo "::notice title=Manifest permissions::$(grep -o 'uses-permission[^>]*android:name="[^"]*"' "$M" | sed 's/.*name="//;s/"//' | tr '\n' ' ')"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: StudyDeck-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
